<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>hello</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; background: #000; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; background: #000; }

    #ar-button {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 24px; font-size: 18px; border: 0; border-radius: 12px;
      background: #fff; color: #000;
    }

    /* namig, ko AR ni na voljo */
    #ar-namig {
      position: absolute; bottom: 24px; left: 0; right: 0;
      padding: 0 16px; text-align: center; color: #fff; font-size: 16px;
    }

    /* točkasti gumbi */
    .hotspot {
      width: 22px; height: 22px; padding: 0;
      border-radius: 50%; border: 2px solid #fff;
      background: #c3b091; cursor: pointer;
      box-shadow: 0 0 0 4px rgba(195, 176, 145, 0.35);
      --min-hotspot-opacity: 0;
    }
    .hotspot:focus { outline: none; }

    .hotspot .opis {
      display: none;
      position: absolute; left: 32px; top: -6px;
      width: max-content; max-width: 220px;
      padding: 10px 12px; border-radius: 8px;
      background: #fff; color: #000; font-size: 14px; line-height: 1.35;
      text-align: left;
    }
    .hotspot.odprt .opis { display: block; }
  </style>
</head>
<body>
  <model-viewer id="mv"
    src="blob.glb"
    alt="Zelen blob"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    auto-rotate
    shadow-intensity="1">

    <button slot="ar-button" id="ar-button">Poglej v AR</button>

    <div id="ar-namig" hidden>
      AR ni na voljo v tem brskalniku. Odpri stran v Safariju.
    </div>

    <!-- položaji so izračunani točno na površini krogle (v metrih); data-normal = smer, v katero kaže točka -->
    <button class="hotspot" slot="hotspot-1"
            data-position="0.1007 0.0201 0.0302" data-normal="0.865 0.384 0.324">
      <span class="opis">Prva točka: tukaj napiši svoj tekst.</span>
    </button>

    <button class="hotspot" slot="hotspot-2"
            data-position="0.0103 0.1035 0.0207" data-normal="0.044 0.999 0.017">
      <span class="opis">Druga točka: še en opis.</span>
    </button>

    <button class="hotspot" slot="hotspot-3"
            data-position="0.0191 0.0286 0.0955" data-normal="-0.231 0.188 0.955">
      <span class="opis">Tretja točka: in še tretji opis.</span>
    </button>
  </model-viewer>

  <script type="module">
    const mv = document.querySelector('#mv');
    const namig = document.querySelector('#ar-namig');
    const hotspoti = document.querySelectorAll('.hotspot');

    // pokaži namig, če brskalnik ne podpira AR
    mv.addEventListener('load', () => {
      if (!mv.canActivateAR) namig.hidden = false;
    });

    // klik na točko odpre/zapre besedilo
    hotspoti.forEach(h => {
      h.addEventListener('click', (e) => {
        const bilOdprt = h.classList.contains('odprt');
        hotspoti.forEach(x => x.classList.remove('odprt'));
        if (!bilOdprt) h.classList.add('odprt');
        e.stopPropagation();
      });
    });

    // klik drugam zapre besedilo
    document.addEventListener('click', () =>
      hotspoti.forEach(x => x.classList.remove('odprt')));
  </script>
</body>
</html>
