<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; background: #000; }
    #ar-button {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 24px; font-size: 18px; border: 0; border-radius: 12px;
      background: #111; color: #fff;
    }
  </style>
</head>
<body>
  <model-viewer
    src="blob.glb"
    alt="Zelen blob"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    auto-rotate
    shadow-intensity="1">
    <button slot="ar-button" id="ar-button">Poglej v AR</button>
    <div slot="ar-failure" style="position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;font-size:16px">
      AR ni na voljo v tem brskalniku. Odpri stran v Safariju.
    </div>
  </model-viewer>
</body>
</html>
